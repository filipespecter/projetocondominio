name: infinitycondo-local

services:
  postgres:
    image: postgres:16-alpine
    container_name: infinitycondo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: infinitycondo_homolog
      POSTGRES_USER: infinitycondo
      POSTGRES_PASSWORD: infinitycondo_local
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U infinitycondo -d infinitycondo_homolog"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: infinitycondo-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env.docker
    environment:
      PROJECT_ROOT: /workspace
    ports:
      - "127.0.0.1:3333:3333"
    volumes:
      - uploads_data:/app/uploads
      - ./:/workspace:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3333/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: infinitycondo-frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: http://localhost:3333/api
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
    name: infinitycondo_postgres_data
  uploads_data:
    name: infinitycondo_uploads_data
